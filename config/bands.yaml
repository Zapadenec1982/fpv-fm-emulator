    group: "5.8G"
    channels: { E1: 5705, E2: 5685, E3: 5665, E4: 5645, E5: 5885, E6: 5905, E7: 5925, E8: 5945 }
  F:
    name: "Band F / Airwave / FatShark (5.8 GHz)"
    group: "5.8G"
    channels: { F1: 5740, F2: 5760, F3: 5780, F4: 5800, F5: 5820, F6: 5840, F7: 5860, F8: 5880 }
  L:
    name: "Band L / low race (5.8 GHz, vendor variant)"
