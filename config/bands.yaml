# =============================================================================
#  FPV analog video band / channel frequency tables (MHz)
# =============================================================================
#  These tables are editable. The 5.8 GHz A/B/E/F/R bands are the established
#  industry values. The lower ranges (1.2/1.3 GHz, 900 MHz, 2.4 GHz, 3.3 GHz)
#  differ from vendor to vendor — representative sets are given here, adjust
#  them to match your own fleet.
#
#  Channel names may be written bare ("R4") or qualified as "BAND:CHANNEL"
#  ("G13:C4"). Bare names are only allowed when they are unique: C1..C8 are
#  reused by G13/G09/G24/G33, so a bare "C4" is REJECTED — write "G13:C4"
#  (1200 MHz) or "G33:C4" (3440 MHz) to say which one you mean.
#
#  hardware_ranges — reference tuning limits of the Pluto+ (used for warnings).
#    stock  = AD9363 (325 MHz – 3.8 GHz)
#    hacked = AD9361 mod   (70 MHz – 6.0 GHz) — reaches 5.8 GHz directly
#    hackrf = HackRF One   (1 MHz – 6.0 GHz)
# =============================================================================

hardware_ranges:
  stock:  { min_mhz: 325.0, max_mhz: 3800.0, chip: "AD9363" }
  hacked: { min_mhz: 70.0,  max_mhz: 6000.0, chip: "AD9361" }
  hackrf: { min_mhz: 1.0,   max_mhz: 6000.0, chip: "HackRF One" }

bands:

  # ------------------------- 5.8 GHz (main FPV) -----------------------------
  R:
    name: "Raceband (5.8 GHz)"
    group: "5.8G"
    channels: { R1: 5658, R2: 5695, R3: 5732, R4: 5769, R5: 5806, R6: 5843, R7: 5880, R8: 5917 }
  A:
    name: "Band A / Boscam A (5.8 GHz)"
    group: "5.8G"
    channels: { A1: 5865, A2: 5845, A3: 5825, A4: 5805, A5: 5785, A6: 5765, A7: 5745, A8: 5725 }
  B:
